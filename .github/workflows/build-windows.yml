name: Build c4 for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build c4.exe
        shell: msys2 {0}
        run: gcc -O2 -static -o c4.exe c4.c

      - name: Test hello world
        shell: msys2 {0}
        run: |
          cat > hello.c << 'EOF'
          int main() {
              printf("hello, world\n");
              return 0;
          }
          EOF
          ./c4.exe hello.c

      - name: Test self-compile
        shell: msys2 {0}
        run: |
          # c4 编译自己，然后第二代编译 hello.c
          ./c4.exe c4.c hello.c

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: c4-windows-x64
          path: c4.exe
